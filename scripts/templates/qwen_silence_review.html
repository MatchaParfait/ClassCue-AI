<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen 无人声跳过审核</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa;color:#242424}
header{padding:18px 24px;background:#fff;border-bottom:1px solid #d8d8d8}
h1{font-size:21px;margin:0 0 6px}h2{font-size:14px;font-weight:600;margin:0}
p{margin:0;overflow-wrap:anywhere}.source,.muted{color:#606060}.summary{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 24px;border-bottom:1px solid #d8d8d8}
button,select,textarea{font:inherit;border:1px solid #aaa;border-radius:4px;background:#fff;color:inherit}
button,select{padding:7px 10px;min-height:36px}label{display:flex;gap:6px;align-items:center}
main{max-width:1440px;margin:auto;padding:0 24px 24px}
article{padding:18px 0;border-bottom:1px solid #d8d8d8}
.heading{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.time{font-family:monospace;font-size:15px}.duration{color:#9c3737}.flag{color:#9c3737;font-weight:600}
.columns{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px}
.columns>div{min-width:0}canvas{display:block;width:100%;height:70px;background:#f0f2f3;margin-top:8px}
.audio-label{margin:10px 0 4px;font-weight:500}audio{display:block;width:100%;height:36px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.players>div{min-width:0}
.transcript{margin:8px 0 14px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.cue-time{color:#606060;font-family:monospace;font-size:12px}
.review-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
textarea{display:block;width:100%;min-height:52px;padding:8px;margin-top:8px;resize:vertical}
.empty{padding:24px 0;color:#606060}
@media(max-width:760px){header{padding:16px}.toolbar{padding:12px 16px}main{padding:0 16px 20px}.columns{grid-template-columns:1fr;gap:16px}}
@media(max-width:420px){.players{grid-template-columns:1fr}button,select{min-height:44px}.time{font-size:14px}}
</style>
</head>
<body>
<header><h1>Qwen 无人声跳过审核</h1><p class="source">__SOURCE__</p><div id="summary" class="summary"></div></header>
<div class="toolbar">
<button id="export" type="button">导出审核 CSV</button>
<label>状态 <select id="filter"><option value="all">全部</option><option value="pending">待审</option><option value="speech">误删人声</option><option value="edge">字头字尾受损</option><option value="uncertain">不确定</option><option value="safe">无人声</option><option value="baseline">原转写有字词</option><option value="splice">对齐跨衔接</option></select></label>
<label>排序 <select id="sort"><option value="time">时间顺序</option><option value="duration">最长优先</option></select></label>
<span id="count" aria-live="polite"></span>
</div>
<main id="rows"></main>
<script>
"use strict";
const entries=__DATA__;
const summary=__SUMMARY__;
const key="qwen-silence-review:"+location.pathname+":"+summary.padding_seconds+":"+summary.minimum_seconds;
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch{}
const statusOptions=[["pending","待审"],["safe","无人声"],["speech","误删人声"],["edge","字头字尾受损"],["uncertain","不确定"]];
const root=document.getElementById("rows");
const nodes=new Map();
function timeLabel(t){
 const ms=Math.round(t*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;
 return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms%1000).padStart(3,"0")}`;
}
function getState(e){return saved[e.index]||{review:"pending",notes:""}}
function save(e,review,notes){saved[e.index]={review,notes};try{localStorage.setItem(key,JSON.stringify(saved))}catch{}updateCount()}
function updateCount(){
 document.getElementById("count").textContent=`已审 ${entries.filter(e=>getState(e).review!=="pending").length} / ${entries.length}`;
}
for(const text of [
 `跳过 ${entries.length} 段 / ${summary.removed_seconds.toFixed(2)} s`,
 `原音频 ${(summary.source_seconds/60).toFixed(2)} min`,
 `语音缓冲 ${summary.padding_seconds.toFixed(2)} s`,
 `最短跳过 ${summary.minimum_seconds.toFixed(2)} s`,
 `转写对照 ${timeLabel(summary.sample_start_seconds)} - ${timeLabel(summary.sample_end_seconds)}`,
 ...summary.timings
]){const span=document.createElement("span");span.textContent=text;document.getElementById("summary").append(span)}
function draw(canvas,e,currentTime=0){
 const width=canvas.clientWidth,height=canvas.clientHeight;if(!width)return;
 const dpr=devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;
 const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
 const duration=e.clip_end_seconds-e.clip_start_seconds;
 const x0=e.deleted_start_in_clip/duration*width,x1=e.deleted_end_in_clip/duration*width;
 ctx.fillStyle="#f3d6d6";ctx.fillRect(x0,0,x1-x0,height);
 ctx.strokeStyle="#55756b";ctx.beginPath();
 e.envelope.forEach((a,i)=>{const x=i/Math.max(1,e.envelope.length-1)*width;ctx.moveTo(x,height/2-a[0]*height*.45);ctx.lineTo(x,height/2-a[1]*height*.45)});
 ctx.stroke();ctx.strokeStyle="#b23636";ctx.lineWidth=2;
 for(const x of [x0,x1]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke()}
 ctx.strokeStyle="#14729b";ctx.lineWidth=1;const play=currentTime/duration*width;
 ctx.beginPath();ctx.moveTo(play,0);ctx.lineTo(play,height);ctx.stroke();
}
function player(file,label){
 const box=document.createElement("div"),name=document.createElement("p");name.className="audio-label";name.textContent=label;box.append(name);
 const audio=document.createElement("audio");audio.controls=true;audio.preload="metadata";audio.setAttribute("aria-label",label);
 if(file){audio.src=file;box.append(audio)}else{const empty=document.createElement("span");empty.className="muted";empty.textContent="无保留上下文";box.append(empty)}
 return [box,audio];
}
function transcripts(items){
 const box=document.createElement("div");box.className="transcript";
 if(!items.length){box.textContent="无字幕";box.classList.add("muted");return box}
 for(const item of items){const line=document.createElement("div"),stamp=document.createElement("span");stamp.className="cue-time";stamp.textContent=timeLabel(item.start)+" - "+timeLabel(item.end)+" ";
  line.append(stamp,document.createTextNode(item.text));box.append(line)}
 return box;
}
for(const e of entries){
 const item=document.createElement("article");item.dataset.index=e.index;
 const heading=document.createElement("div");heading.className="heading";
 for(const [text,cls] of [[`#${e.index}`,""],[`${e.start_time} - ${e.end_time}`,"time"],[`${e.duration_seconds.toFixed(2)} s`,"duration"]]){
  const span=document.createElement("span");span.textContent=text;span.className=cls;heading.append(span);
 }
 if(e.baseline_words_in_removed_region.length){const flag=document.createElement("span");flag.className="flag";flag.textContent=`原转写重叠 ${e.baseline_words_in_removed_region.length} 个字词`;heading.append(flag)}
 if(e.splice_warnings?.length){const flag=document.createElement("span");flag.className="flag";flag.textContent="对齐跨衔接："+e.splice_warnings.map(w=>w.word).join("、");heading.append(flag)}
 const columns=document.createElement("div");columns.className="columns";
 const left=document.createElement("div"),right=document.createElement("div");
 const [originalBox,originalAudio]=player(e.original_audio,"原始音频（含前后上下文）");
 const canvas=document.createElement("canvas");canvas.setAttribute("role","img");canvas.setAttribute("aria-label",`第${e.index}段原始波形，红色区间为跳过范围`);
 left.append(originalBox,canvas);
 const players=document.createElement("div");players.className="players";
 players.append(player(e.deleted_audio,"实际跳过音频")[0],player(e.joined_audio,"跳过后衔接")[0]);left.append(players);
 const controls=document.createElement("div");controls.className="review-controls";const label=document.createElement("label");label.append(document.createTextNode("审核结果 "));
 const select=document.createElement("select");select.setAttribute("aria-label",`第${e.index}段审核结果`);
 for(const [value,text] of statusOptions){const option=document.createElement("option");option.value=value;option.textContent=text;select.append(option)}
 select.value=getState(e).review;label.append(select);controls.append(label);left.append(controls);
 const notes=document.createElement("textarea");notes.value=getState(e).notes;notes.placeholder="备注";notes.setAttribute("aria-label",`第${e.index}段备注`);left.append(notes);
 select.onchange=()=>save(e,select.value,notes.value);notes.oninput=()=>save(e,select.value,notes.value);
 for(const [title,items] of [["保留无人声",e.baseline],["跳过无人声",e.filtered]]){
  const h=document.createElement("h2");h.textContent=title;right.append(h,transcripts(items));
 }
 columns.append(left,right);item.append(heading,columns);root.append(item);nodes.set(e.index,item);
 new ResizeObserver(()=>draw(canvas,e,originalAudio.currentTime)).observe(canvas);
 originalAudio.addEventListener("timeupdate",()=>draw(canvas,e,originalAudio.currentTime));
}
function filter(){
 const mode=document.getElementById("filter").value,sort=document.getElementById("sort").value;
 const ordered=[...entries].sort((a,b)=>sort==="duration"?b.duration_seconds-a.duration_seconds:a.index-b.index);
 let visible=0;
 for(const e of ordered){const node=nodes.get(e.index);node.hidden=mode!=="all"&&(mode==="baseline"?!e.baseline_words_in_removed_region.length:mode==="splice"?!e.splice_warnings?.length:getState(e).review!==mode);
  if(!node.hidden)visible++;root.append(node)}
 let empty=document.getElementById("empty");if(!empty){empty=document.createElement("p");empty.id="empty";empty.className="empty";empty.textContent="无匹配区间";root.append(empty)}empty.hidden=visible>0;
}
document.getElementById("filter").onchange=filter;document.getElementById("sort").onchange=filter;
document.getElementById("export").onclick=()=>{
 const cols=["index","start_seconds","end_seconds","start_time","end_time","duration_seconds","start_sample","end_sample","review","notes"];
 function quote(value){return '"'+String(value??"").replaceAll('"','""')+'"'}
 const lines=[cols.join(","),...entries.map(e=>cols.map(c=>quote(c==="review"?getState(e).review:c==="notes"?getState(e).notes:e[c])).join(","))];
 const url=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"})),link=document.createElement("a");link.href=url;link.download="silence_review.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
document.addEventListener("play",event=>{if(event.target.tagName==="AUDIO"){for(const audio of document.querySelectorAll("audio"))if(audio!==event.target)audio.pause()}},true);
updateCount();filter();
</script>
</body>
</html>
