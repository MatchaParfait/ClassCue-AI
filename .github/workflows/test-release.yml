name: Test Release

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full commit SHA to package
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: signed-public-release
  cancel-in-progress: false

jobs:
  build-draft:
    if: github.repository == 'MatchaParfait/ClassCue-AI' && vars.ENABLE_SIGNED_RELEASES == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate source and test identity
        shell: pwsh
        run: |
          if ($env:EXPECTED_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "Full commit SHA required" }
          $Commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Commit -ne $env:EXPECTED_COMMIT) { throw "Unexpected checkout" }
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $Version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid package version" }
          $Tag = "test-$Version"
          "TEST_TAG=$Tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gh release view "$Tag" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Test release already exists; do not overwrite published assets" }
          exit 0
      - name: Check signing configuration and repository contents
        shell: pwsh
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw "Release signing identity is not configured" }
          python -m pip install cryptography filelock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_repository_hygiene.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from scripts.release import signed, ROOT; signed(ROOT, {'schema': 1})"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend and signed installation package
        shell: pwsh
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release.py build --notes release/test-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test draft without changing the update feed
        shell: pwsh
        run: |
          $Packages = @(Get-ChildItem -LiteralPath .runtime/dist -Filter "*.zip" -File)
          if ($Packages.Count -ne 1) { throw "Expected exactly one installation package" }
          $Package = $Packages[0].FullName
          python scripts/release.py verify "$Package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Title = "ClassCue AI $env:TEST_VERSION - Test Preview"
          gh release create "$env:TEST_TAG" --target "$env:EXPECTED_COMMIT" --draft --prerelease --latest=false --title "$Title" --notes-file release/test-notes.md "$Package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath "$Package" -Algorithm SHA256 | Format-List
