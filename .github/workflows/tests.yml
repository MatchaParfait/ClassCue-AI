name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade uv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend integration dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        run: uv run --locked --group dev python -m pytest tests -q
      - name: Check syntax
        shell: pwsh
        run: |
          python -m compileall -q classcue api scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Build
        run: npm run build
