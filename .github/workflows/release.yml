name: Release And Announcements

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["release/announcements.json"]
  workflow_dispatch:
    inputs:
      action:
        description: Release operation
        type: choice
        options: [refresh-feed, finalize]
        default: refresh-feed
        required: true
      release_tag:
        description: Reviewed draft tag (finalize only)
        type: string
      expected_commit:
        description: Reviewed full commit SHA (finalize only)
        type: string
      expected_sha256:
        description: Reviewed ZIP SHA-256 (finalize only)
        type: string
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: signed-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MatchaParfait/ClassCue-AI' && vars.ENABLE_SIGNED_RELEASES == 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ github.ref_name }}
      FINALIZE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - name: Validate finalization inputs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'finalize'
        shell: pwsh
        run: |
          if ($env:FINALIZE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid release tag" }
          if ($env:EXPECTED_COMMIT -notmatch '^[a-f0-9]{40}$') { throw "Full reviewed commit SHA required" }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-f0-9]{64}$') { throw "Reviewed ZIP SHA-256 required" }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'finalize' && inputs.expected_commit || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check signing configuration
        shell: pwsh
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw "Set repository Actions secret RELEASE_SIGNING_KEY. See docs/releases.md." }
          python -m pip install cryptography filelock
          python -c "from scripts.release import signed, ROOT; signed(ROOT, {'schema': 1})"
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test And Build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --group dev python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location frontend
          npm test -- --maxWorkers=2 --minWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          uv run --locked --group dev python scripts/release.py build --tag "$env:RELEASE_TAG" --notes release/notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --group dev python scripts/release.py feed --release .runtime/dist/app-release.json --output .runtime/feed-preflight.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create Reviewed Draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $Artifacts = @((Get-ChildItem -LiteralPath .runtime/dist -Filter "*.zip" -File).FullName) + @((Resolve-Path .runtime/dist/app-release.json).Path)
          $Commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create "$env:RELEASE_TAG" --verify-tag --target "$Commit" --draft --title "$env:RELEASE_TAG" --notes-file release/notes.md $Artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Draft only. Review its assets before dispatching finalize."
      - name: Verify Reviewed Assets And Finalize
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'finalize'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .runtime/reviewed | Out-Null
          gh release view "$env:FINALIZE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease,assets | Set-Content -Encoding utf8 .runtime/reviewed/release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "$env:FINALIZE_TAG" --dir .runtime/reviewed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Cannot establish current stable version" }
          python scripts/release_gate.py --tag "$env:FINALIZE_TAG" --commit "$env:EXPECTED_COMMIT" --sha256 "$env:EXPECTED_SHA256" --directory .runtime/reviewed --release-info .runtime/reviewed/release.json --latest "$Latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release.py feed --release .runtime/reviewed/app-release.json --output .runtime/feed-preflight.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:FINALIZE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign And Publish Feed
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .runtime/feed-source | Out-Null
          $Latest = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $Latest -match '^v\d+\.\d+\.\d+$') {
            gh release download $Latest --pattern app-release.json --dir .runtime/feed-source --clobber
            if ($LASTEXITCODE -ne 0) { throw "Latest release has no signed descriptor; refusing to remove update information." }
            python scripts/release.py feed --release .runtime/feed-source/app-release.json
          } else {
            # Only an actually empty release list permits an announcements-only feed.
            $Stable = gh release list --exclude-pre-releases --exclude-drafts --json tagName
            if ($LASTEXITCODE -ne 0 -or ($Stable | ConvertFrom-Json).Count -gt 0) { throw "Cannot establish latest stable release." }
            python scripts/release.py feed
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view update-feed 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-feed --target main --prerelease --latest=false --title "Signed update and announcement feed" --notes "Machine-readable signed feed; see docs/releases.md."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload update-feed .runtime/feed.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
