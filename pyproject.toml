[project]
name = "classroom-video-study"
version = "0.2.1"
description = "Local classroom video transcription and exam-point study navigation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=46.0.0,<47",
    "av>=12.0.0",
    "faster-whisper>=1.1.0",
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "huggingface-hub>=0.34.0",
    "httpx>=0.28.1,<0.29",
    "openai>=1.0.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.39.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=6.0,<7; sys_platform == 'win32'",
    "pystray>=0.19,<1; sys_platform == 'win32'",
    "pillow>=11,<13; sys_platform == 'win32'",
]

[tool.uv]
package = false
