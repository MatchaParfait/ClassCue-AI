[project]
name = "classroom-video-study"
version = "0.2.2"
description = "Local classroom video transcription and exam-point study navigation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "comtypes==1.4.17; sys_platform == 'win32'",
    "cryptography>=46.0.0,<47",
    "av>=12.0.0",
    "faster-whisper>=1.1.0",
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "huggingface-hub>=0.34.0",
    "httpx>=0.28.1,<0.29",
    "openai>=1.0.0",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.20,<2",
    "pydantic>=2.8.0",
    "playwright>=1.55,<2",
    "pillow>=11,<13",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<6",
    "markdown-it-py>=3,<5",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0.0",
    "qrcode>=8.2,<9",
    "reportlab>=4.4,<5",
    "scikit-image>=0.24,<1",
    "streamlit>=1.39.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=6.0,<7; sys_platform == 'win32'",
    "pystray>=0.19,<1; sys_platform == 'win32'",
    "pillow>=11,<13; sys_platform == 'win32'",
]

[tool.uv]
package = false
