<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂重点复习</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5e9;color:#171a14;font:14px "Segoe UI","Microsoft YaHei",sans-serif}
header{height:64px;background:#fffdf4;border-bottom:1px solid #e0dbc5;display:flex;align-items:center;padding:0 32px}
.brand{display:inline-flex;align-items:center;gap:10px;background:#fde44c;border-radius:24px;padding:8px 14px;font-weight:700}
.eye{width:23px;height:23px;border-radius:50%;background:#85cb72;display:grid;place-items:center}
.eye:after{content:"";width:11px;height:11px;border-radius:50%;background:#171a14}
main{max-width:1704px;padding:0 32px 32px;margin:auto}
.heading{margin:28px 0 24px;padding:28px 32px;background:#ffea71;border:1px solid #fff;border-radius:32px 32px 72px 32px;min-height:228px}
.eyebrow{margin:0;color:#596153;font-size:12px}
h1{font-size:34px;line-height:1.3;margin:8px 0 24px;font-weight:800}
.import-actions{display:flex;gap:10px}
button{font:inherit;cursor:pointer;color:#285c35;border:1px solid #b7c8a7;border-radius:24px;background:#fffdf4;padding:9px 16px}
button:disabled{cursor:default;color:#596153;border-color:#ded8bd;background:#fff8d7}
button:focus-visible{outline:2px solid #285c35;outline-offset:3px}
.sync{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border:1px solid #e0dbc5;border-radius:18px;background:#fffdf4;color:#596153;min-height:50px}
.sync[data-error="true"]{color:#a52d2d;border-color:#d49d91}
.sync p{margin:0;line-height:1.7;white-space:pre-line}
.actions{display:flex;gap:8px;margin-left:auto}
section{margin-top:24px}
h2{font-size:16px;margin:0 0 16px;font-weight:700}
.folders,.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.folders{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.folder{display:flex;align-items:center;gap:14px;padding:20px;border:1px solid #e1c747;border-radius:24px;background:#ffeb79;min-width:0}
.folder>div{min-width:0}
.folder strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.folder-icon{display:block;width:24px;height:18px;border:2px solid #5a7850;border-radius:3px;flex-shrink:0;position:relative}
.folder-icon:before{content:"";position:absolute;width:10px;height:5px;border:2px solid #5a7850;border-bottom:0;top:-6px;left:-2px;border-radius:3px 3px 0 0}
.video{border:4px solid #ffe76c;border-radius:24px;overflow:hidden;min-width:0;background:#fff7dc;padding-bottom:16px}
.thumbnail{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:#eee9d9;border-radius:18px;overflow:hidden}
.thumbnail img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#eee9d9}
.video-icon{width:29px;height:34px;border:2px solid #a7ad98;border-radius:4px;position:relative}
.video-icon:after{content:"";position:absolute;border-left:9px solid #a7ad98;border-top:6px solid transparent;border-bottom:6px solid transparent;top:9px;left:9px}
.video strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.7;min-height:48px;margin:12px 14px 8px}
small{display:block;color:#737969;font-size:12px;margin-top:6px}
.snapshot-notice{margin:16px 0 0;color:#737969;font-size:12px}
.video small{margin:0 14px}
.empty{min-height:240px;display:grid;align-content:center;justify-items:center;gap:12px;color:#737969}
[hidden]{display:none!important}
dialog{border:1px solid #dddccf;border-radius:18px;max-width:480px;padding:28px;background:#fffef7}
dialog::backdrop{background:#171a1466}
@media(min-width:1100px){.videos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1440px){.videos{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1800px){.videos{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<header><div class="brand"><span class="eye" aria-hidden="true"></span>课堂重点复习</div></header>
<main aria-label="视频库启动预览">
  <div class="heading"><p class="eyebrow">收藏课程，温习重点。</p><h1>视频库</h1>
    <div class="import-actions"><button disabled>导入视频</button><button disabled>导入文件夹</button></div>
  </div>
  <div class="sync" id="sync" role="status"><p id="message"><!--STARTUP_MESSAGE--></p>
    <div class="actions" id="actions" hidden><button onclick="retry()">重试启动</button><button onclick="pywebview.api.open_logs()">打开日志目录</button></div>
  </div>
  <!--LIBRARY_PREVIEW-->
</main>
<dialog id="dialog"><p id="dialog-message"></p><button autofocus onclick="document.querySelector('dialog').close();pywebview.api.respond('cancel')">返回</button></dialog>
<script>
window.__classroomDesktopView=()=>{
  const anchor=scrollY>0 ? [...document.querySelectorAll("[data-library-key]")].find(card=>{
    const bounds=card.getBoundingClientRect();
    return bounds.bottom>0 && bounds.top<innerHeight;
  }) : null;
  return {scroll_y:scrollY,anchor:anchor?.dataset.libraryKey??null,
    offset:anchor?.getBoundingClientRect().top??0};
};
document.querySelectorAll(".thumbnail img").forEach(image=>{
  image.addEventListener("error",()=>image.remove(),{once:true});
});
window.__classroomDesktopProgress=(message,error=false)=>{
  document.getElementById("message").textContent=message;
  document.getElementById("actions").hidden=!error;
  document.getElementById("sync").dataset.error=String(error);
};
window.addEventListener("classroom-desktop-dialog",e=>{
  document.getElementById("dialog-message").textContent=e.detail.message;
  document.getElementById("dialog").showModal();
});
async function retry(){
  window.__classroomDesktopProgress("正在重新连接本地视频库…");
  try{await pywebview.api.retry()}catch(e){window.__classroomDesktopProgress(String(e),true)}
}
</script>
</html>
